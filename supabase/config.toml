# supabase/config.toml
# ─────────────────────────────────────────────────────────
# Supabase CLI project configuration.
# This file is committed to the repo.
# No secrets go here — secrets live in GitHub Secrets.
# ─────────────────────────────────────────────────────────

project_id = "setu"  # used by `supabase link`; overridden by SUPABASE_PROJECT_REF

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "https://localhost:5173",
  # GitHub Pages production URL — update with your actual org/repo
  "https://yourgithubusername.github.io/SETU",
  "https://yourgithubusername.github.io/SETU/auth/callback",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true

# OTP via SMS — required for SETU's phone-number primary auth
[auth.sms.twilio]
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

[analytics]
enabled = false
