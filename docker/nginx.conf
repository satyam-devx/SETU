# SETU — production nginx server block
#
# Serves the Vite production build (dist/) with SPA history-API fallback
# and the same security headers / caching rules as public/_headers +
# public/_redirects (the config Cloudflare Pages/Netlify read natively —
# see HOSTING.md). This lets the Docker image behave the same way as
# those hosts.
#
# Runs on the nginxinc/nginx-unprivileged base image as a non-root user,
# hence the unprivileged port 8080 instead of 80 — see Dockerfile.
#
# This container terminates plain HTTP only. In production, put it
# behind a TLS-terminating proxy/load balancer (Cloudflare, your own
# reverse proxy, etc.) — see DOCKER.md "Production" section.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version in the Server header / error pages.
    server_tokens off;
    autoindex off;

    # Defense in depth — nothing dotfile-shaped should ever be served
    # (no secrets ship in this image; this just avoids accidentally
    # exposing Cloudflare/Netlify-only artifacts like a stray .well-known
    # exemption aside).
    location ~ /\.(?!well-known) {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    # Security headers for every response from this server.
    include /etc/nginx/security-headers.conf;

    # Long-cache fingerprinted build assets (Vite hashes filenames, so a
    # new deploy always ships new URLs — safe to cache "forever").
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Never cache the FCM service worker — it must update promptly.
    location = /firebase-messaging-sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a redeploy's new hashed asset
    # references won't reach existing visitors.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA history-API fallback — mirrors public/_redirects exactly
    # ("/* /index.html 200"): every non-asset path serves index.html so
    # React Router can handle client-side routes like /customer/orders,
    # /vendor/*, /admin/*, /superadmin/*, including on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
