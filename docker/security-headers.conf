# SETU — HTTP security headers for the Dockerized nginx image
#
# This is a 1:1 mirror of public/_headers (the config Cloudflare Pages /
# Netlify read natively — see HOSTING.md). It is `include`d from more than
# one location block in nginx.conf because nginx's `add_header` directive
# does NOT inherit into a location that defines its own `add_header`
# (e.g. the /assets/ and =/firebase-messaging-sw.js blocks, which also set
# Cache-Control) — see http://nginx.org/en/docs/http/ngx_http_headers_module.html
#
# ⚠️  Keep this in sync with public/_headers by hand — there is no build
# step that generates one from the other. If you add a new third-party
# origin to public/_headers' CSP, mirror the change here too.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://checkout.razorpay.com https://unpkg.com https://api.mapbox.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://api.mapbox.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.razorpay.com https://lumberjack.razorpay.com https://*.googleapis.com https://fcm.googleapis.com https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com https://*.tile.openstreetmap.org https://unpkg.com; frame-src 'self' https://api.razorpay.com https://*.razorpay.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), payment=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
