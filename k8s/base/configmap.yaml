apiVersion: v1
kind: ConfigMap
metadata:
  name: setu-realtime-config
  namespace: setu
data:
  NODE_ENV: production
  REALTIME_PORT: "8787"
  OTEL_ENABLED: "false"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://setu-otel-collector:4318/v1/traces"
  OTEL_TRACE_SAMPLE_RATE: "0.1"
  REALTIME_HOST: 0.0.0.0
  KAFKA_ENABLED: "true"
  KAFKA_CLIENT_ID: setu-k8s
  KAFKA_REALTIME_GROUP_ID: setu-realtime-projector-v1
  KAFKA_REALTIME_PROJECTOR: "true"
  KAFKA_OUTBOX_BATCH_SIZE: "100"
  KAFKA_OUTBOX_POLL_MS: "1000"
  KAFKA_MAX_RETRIES: "5"
  KAFKA_RETRY_BASE_MS: "5000"
  KAFKA_RETRY_MAX_MS: "300000"
  KAFKA_EVENT_DEDUPE_TTL: "604800"
  REALTIME_MAX_CONNECTIONS: "5000"
  RIDER_LOCATION_MIN_INTERVAL_SECONDS: "5"
  REDIS_URL: redis://setu-redis:6379
  KAFKA_BROKERS: setu-kafka:9092
  REALTIME_ALLOWED_ORIGINS: https://setu.example.com

  METRICS_PORT: "9464"
  KAFKA_METRICS_PORT: "9465"
  DOMAIN_WORKER_METRICS_PORT: "9466"
