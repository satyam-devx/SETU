apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: setu-default-deny
  namespace: setu
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: setu
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        # OTLP HTTP: app pods -> setu-otel-collector. Without this, every
        # trace export call silently fails even when OTEL_ENABLED=true.
        - protocol: TCP
          port: 4318
        # OTLP gRPC: setu-otel-collector -> its configured tracing backend
        # (Jaeger locally; a managed backend in production). The collector
        # pod is itself subject to this same default-deny policy.
        - protocol: TCP
          port: 4317
