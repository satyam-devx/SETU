apiVersion: apps/v1
kind: Deployment
metadata:
  name: setu-realtime
  namespace: setu
  labels:
    app.kubernetes.io/name: setu-realtime
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: setu-realtime
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9464"
      labels:
        app.kubernetes.io/name: setu-realtime
    spec:
      serviceAccountName: setu-realtime
      terminationGracePeriodSeconds: 30
      containers:
        - name: realtime
          image: ghcr.io/satyam-devx/setu-realtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: setu-realtime-config
            - secretRef:
                name: setu-realtime-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
