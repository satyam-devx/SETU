apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: setu-redis
  namespace: setu
spec:
  serviceName: setu-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: setu-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: setu-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: setu-redis
  namespace: setu
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: setu-redis
  ports:
    - port: 6379
      targetPort: 6379
