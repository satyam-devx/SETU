apiVersion: v1
kind: ServiceAccount
metadata:
  name: setu-prometheus
  namespace: setu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: setu-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: setu-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: setu-prometheus
subjects:
  - kind: ServiceAccount
    name: setu-prometheus
    namespace: setu
