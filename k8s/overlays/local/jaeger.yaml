apiVersion: apps/v1
kind: Deployment
metadata:
  name: setu-jaeger
  namespace: setu
spec:
  replicas: 1
  selector: {matchLabels: {app: setu-jaeger}}
  template:
    metadata: {labels: {app: setu-jaeger}}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.75
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: ui, containerPort: 16686}
---
apiVersion: v1
kind: Service
metadata:
  name: setu-jaeger
  namespace: setu
spec:
  selector: {app: setu-jaeger}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: ui, port: 16686, targetPort: ui}
