apiVersion: apps/v1
kind: Deployment
metadata:
  name: setu-prometheus
  namespace: setu
spec:
  replicas: 1
  selector:
    matchLabels: {app: setu-prometheus}
  template:
    metadata:
      labels: {app: setu-prometheus}
    spec:
      serviceAccountName: setu-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: setu-prometheus-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: setu-prometheus
  namespace: setu
spec:
  selector: {app: setu-prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: setu-grafana
  namespace: setu
spec:
  replicas: 1
  selector:
    matchLabels: {app: setu-grafana}
  template:
    metadata:
      labels: {app: setu-grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
          volumeMounts:
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards}
      volumes:
        - name: dashboards
          configMap: {name: setu-grafana-dashboard}
        - name: provisioning
          configMap: {name: setu-grafana-provisioning}
---
apiVersion: v1
kind: Service
metadata:
  name: setu-grafana
  namespace: setu
spec:
  selector: {app: setu-grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: setu-grafana-dashboard
  namespace: setu
data:
  setu-overview.json: |
    {"title": "SETU Infrastructure Overview", "uid": "setu-overview", "schemaVersion": 39, "panels": [{"id": 1, "type": "stat", "title": "Realtime Connections", "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}, "targets": [{"expr": "setu_realtime_connections", "refId": "A"}]}, {"id": 2, "type": "timeseries", "title": "WebSocket Connections", "gridPos": {"h": 8, "w": 18, "x": 6, "y": 0}, "targets": [{"expr": "setu_realtime_connections", "legendFormat": "connections", "refId": "A"}]}, {"id": 3, "type": "timeseries", "title": "Kafka Events Processed", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}, "targets": [{"expr": "sum by (domain) (rate(setu_kafka_events_processed_total[5m]))", "legendFormat": "{{domain}}", "refId": "A"}]}, {"id": 4, "type": "timeseries", "title": "Kafka Retries", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}, "targets": [{"expr": "sum by (domain) (rate(setu_kafka_events_retry_total[5m]))", "legendFormat": "{{domain}}", "refId": "A"}]}, {"id": 5, "type": "timeseries", "title": "Kafka DLQ", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}, "targets": [{"expr": "sum by (domain) (rate(setu_kafka_events_dlq_total[5m]))", "legendFormat": "{{domain}}", "refId": "A"}]}, {"id": 6, "type": "timeseries", "title": "Outbox Backlog (unpublished rows)", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}, "targets": [{"expr": "setu_outbox_backlog", "legendFormat": "backlog", "refId": "A"}]}, {"id": 7, "type": "timeseries", "title": "HTTP API p95 Latency", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24}, "targets": [{"expr": "histogram_quantile(0.95, sum(rate(setu_http_request_duration_seconds_bucket[5m])) by (le, route))", "legendFormat": "{{route}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "s"}}}, {"id": 8, "type": "timeseries", "title": "HTTP API 5xx Error Rate", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24}, "targets": [{"expr": "sum(rate(setu_http_request_duration_seconds_count{status=~\"5..\"}[5m])) / sum(rate(setu_http_request_duration_seconds_count[5m]))", "legendFormat": "error rate", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "percentunit"}}}, {"id": 9, "type": "timeseries", "title": "Domain Event Processing p95", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32}, "targets": [{"expr": "histogram_quantile(0.95, sum(rate(setu_domain_event_duration_seconds_bucket[5m])) by (le, domain))", "legendFormat": "{{domain}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "s"}}}, {"id": 10, "type": "timeseries", "title": "Outbox Publish p95 Latency", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32}, "targets": [{"expr": "histogram_quantile(0.95, sum(rate(setu_outbox_publish_duration_seconds_bucket[5m])) by (le))", "legendFormat": "publish p95", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "s"}}}]}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: setu-grafana-provisioning
  namespace: setu
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: SETU
        orgId: 1
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://setu-prometheus:9090
        isDefault: true
