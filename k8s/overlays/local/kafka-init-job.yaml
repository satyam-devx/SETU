# The local Kafka StatefulSet (kafka.yaml) runs with
# KAFKA_AUTO_CREATE_TOPICS_ENABLE=false, matching production practice, and
# every kafkajs client in server/realtime also sets
# allowAutoTopicCreation:false. Nothing was creating these topics for the
# k8s path — docker-compose.yml has an equivalent kafka-init service, but
# the k8s overlay didn't. Without this Job, setu-realtime/setu-kafka-worker/
# setu-domain-workers would fail with UnknownTopicOrPartition on first boot.
apiVersion: batch/v1
kind: Job
metadata:
  name: setu-kafka-init
  namespace: setu
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: setu-kafka-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: apache/kafka:4.0.0
          env:
            - name: BOOTSTRAP
              value: "setu-kafka:9092"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              for i in $(seq 1 30); do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --list >/dev/null 2>&1 && break || sleep 2
              done
              create() {
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" \
                  --create --if-not-exists --topic "$1" --partitions "$2" --replication-factor 1
              }
              create setu.order.events 6
              create setu.notification.events 3
              create setu.delivery.events 6
              create setu.payment.events 6
              create setu.inventory.events 6
              create setu.dispatch.events 6
              create setu.financial.events 3
              create setu.domain.events 3
              create setu.payment.events.retry 6
              create setu.payment.events.dlq 6
              create setu.inventory.events.retry 6
              create setu.inventory.events.dlq 6
              create setu.dispatch.events.retry 6
              create setu.dispatch.events.dlq 6
              create setu.financial.events.retry 3
              create setu.financial.events.dlq 3
              echo "SETU Kafka topics ready."
