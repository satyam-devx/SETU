apiVersion: apps/v1
kind: Deployment
metadata:
  name: setu-realtime
  namespace: setu
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: realtime
          image: ghcr.io/satyam-devx/setu-realtime:latest
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
