<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%setu-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SETU — Rural Commerce OS</title>
    <meta name="description" content="SETU — Rural Commerce Operating System for Madhubani, Bihar" />
    <!--
      No frame-ancestors here: per spec, browsers ignore frame-ancestors
      (and sandbox) when a CSP is delivered via <meta> -- it can only take
      effect via the real HTTP response header. Chrome logs a console
      warning about it on every load if it's present, which fails the E2E
      "no unhandled console errors" check for no real security benefit.
      The actual, effective frame-ancestors 'none' (plus X-Frame-Options:
      DENY as a legacy fallback) already ships as real HTTP headers -- see
      docker/security-headers.conf and public/_headers. Don't re-add it here.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'self' https://checkout.razorpay.com https://*.razorpay.com; script-src 'self' https://checkout.razorpay.com https://unpkg.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://api.mapbox.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self' https://*.supabase.co; upgrade-insecure-requests" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
