name: SETU CI — Validate, Test & Gate

# ─────────────────────────────────────────────────────────
# Runs on every push and pull request to any branch.
# This workflow is a GATE: it must pass before anything deploys.
# It never touches production. It only validates.
# ─────────────────────────────────────────────────────────

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Dependency audit ────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Audit production dependencies (blocking — high + critical)
        # Runtime deps that SHIP to users must have no high/critical CVEs.
        # --omit=dev excludes build-only tooling (vite/esbuild), whose
        # dev-server advisories never reach production. This gate blocks.
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (non-blocking — visibility)
        # Includes dev tooling; surfaces issues without blocking the build.
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # ── 2. Build verification ─────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Build with real secrets if available (PRs from forks won't have them)
      # Falls back gracefully to placeholder values — the build itself
      # must succeed regardless (see supabase.js safe fallback).
      - name: Build
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          VITE_FIREBASE_API_KEY:              ${{ secrets.VITE_FIREBASE_API_KEY || 'placeholder' }}
          VITE_FIREBASE_AUTH_DOMAIN:          ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'placeholder.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID:           ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'placeholder-project' }}
          VITE_FIREBASE_STORAGE_BUCKET:       ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'placeholder.appspot.com' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID:  ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
          VITE_FIREBASE_APP_ID:               ${{ secrets.VITE_FIREBASE_APP_ID || '1:000000000000:web:placeholder' }}
          VITE_FIREBASE_VAPID_KEY:            ${{ secrets.VITE_FIREBASE_VAPID_KEY || 'placeholder-vapid-key' }}
          VITE_MAPBOX_TOKEN:                  ${{ secrets.VITE_MAPBOX_TOKEN || 'pk.placeholder' }}
          VITE_RAZORPAY_KEY_ID:               ${{ secrets.VITE_RAZORPAY_KEY_ID || 'rzp_test_placeholder' }}
        run: npm run build

      - name: Check bundle size (warn if chunk >500KB)
        run: |
          echo "=== Bundle size report ==="
          du -sh dist/assets/*.js 2>/dev/null | sort -rh | head -20
          # Fail if any single JS chunk exceeds 600KB (hard limit)
          OVERSIZED=$(find dist/assets -name "*.js" -size +600k 2>/dev/null)
          if [ -n "$OVERSIZED" ]; then
            echo "::warning::Oversized JS chunks detected:"
            echo "$OVERSIZED"
          fi

      - name: Verify SPA routing setup (404.html exists)
        run: |
          cp dist/index.html dist/404.html
          ls -lh dist/404.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ── 3. Migration validation ───────────────────────────
  validate-migrations:
    name: Validate SQL Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration file naming convention
        # Migrations must be numbered sequentially with no gaps (except intentional skips).
        # Format: NNN_description.sql  (e.g. 001_initial.sql, 002_payments.sql)
        run: |
          python3 scripts/validate_migrations.py

      - name: Validate SQL syntax (dry-run via pg_format lint)
        run: |
          # Install pgFormatter for syntax checking
          pip install pgspecial 2>/dev/null || true
          for f in supabase/migrations/*.sql; do
            [ -f "$f" ] || continue
            echo "Checking: $f"
            # Basic SQL syntax check: look for common mistakes
            python3 scripts/lint_sql.py "$f"
          done

      - name: Check all migrations are idempotent
        # Every migration must use CREATE TABLE IF NOT EXISTS, etc.
        run: |
          python3 scripts/check_idempotent.py

  # ── 4. Edge Function type-check ───────────────────────
  validate-edge-functions:
    name: Validate Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Lint all Edge Functions
        # deno check hits CDN rate limits (esm.sh 522) in CI — use deno lint instead.
        # A deno.json config in supabase/functions/ disables no-explicit-any since
        # the functions use `any` legitimately for external API response shapes.
        run: |
          # Write a deno.json that disables the rules that fire on legitimate patterns
          # in Supabase Edge Functions (no-explicit-any for external API responses)
          cat > supabase/functions/deno.json << 'DENOJSON'
          {
            "lint": {
              "rules": {
                "exclude": ["no-explicit-any", "no-unused-vars"]
              }
            }
          }
          DENOJSON

          ERRORS=0
          for dir in supabase/functions/*/; do
            [ -d "$dir" ] || continue
            # Skip _shared — it's a utility library, not a deployable function (no index.ts)
            [[ "$(basename $dir)" == "_shared" ]] && continue
            [ -f "${dir}index.ts" ] || { echo "Skipping $(basename $dir): no index.ts"; continue; }
            echo "Linting: $(basename $dir)"
            deno lint --config supabase/functions/deno.json "${dir}index.ts" 2>&1 || ERRORS=$((ERRORS + 1))
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS function(s) failed lint check"
            exit 1
          fi
          echo "✓ All Edge Functions passed lint"

      - name: Verify required env vars are documented
        # Each function must declare its required secrets in a comment block
        run: python3 scripts/check_function_secrets.py

  # ── 5. Environment variable completeness check ────────
  validate-env-config:
    name: Validate Environment Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .env.example is complete and in sync
        run: python3 scripts/check_env_completeness.py

      - name: Check firebase-messaging-sw.js has no hardcoded credentials
        run: |
          if grep -E "AIza[A-Za-z0-9_-]{35}" public/firebase-messaging-sw.js; then
            echo "::error::Hardcoded Firebase API key found in service worker!"
            exit 1
          fi

      - name: Secret scan (detect accidental credential commits)
        run: python3 scripts/secret_scan.py

  # ── 6. Database money-integrity proof (real RPCs + RLS) ─
  db-integrity-tests:
    name: DB Money-Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies all migrations)
        # Dummy values so config.toml's env() refs (Twilio) resolve — the
        # auth/SMS service isn't exercised by these DB-level tests; we only
        # need the Postgres instance with every migration applied.
        env:
          TWILIO_ACCOUNT_SID:         "dummy"
          TWILIO_MESSAGE_SERVICE_SID: "dummy"
          TWILIO_AUTH_TOKEN:          "dummy"
        run: |
          # Full local stack; the CLI applies every migration in
          # supabase/migrations (including 017) during startup.
          supabase start

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run Phase-1 money-integrity proof
        # ON_ERROR_STOP=1 → any failed assertion fails the job.
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/phase1_money_integrity_test.sql

      - name: Run RLS & RPC permission-guard proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/rls_permission_guards_test.sql

      - name: Run dynamic RBAC proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/rbac_test.sql

      - name: Run feature-flags proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/feature_flags_test.sql

      - name: Run application-settings proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/settings_test.sql

      - name: Run notification-center proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/notifications_test.sql

      - name: Run security-center & audit-immutability proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/security_test.sql

      - name: Run finance-center proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/finance_test.sql

      - name: Run developer-center proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/developer_test.sql

      - name: Run coupons proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/coupons_test.sql

      - name: Run admin search proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/search_test.sql

      - name: Run security ops proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/security_ops_test.sql

      - name: Run finance depth proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/finance_depth_test.sql

      - name: Run developer ops proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/developer_ops_test.sql

      - name: Run notification delivery proof
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f qa/sql/notification_delivery_test.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
