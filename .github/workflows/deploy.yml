name: SETU Deploy — Migrate, Functions & Frontend

# ─────────────────────────────────────────────────────────
# Triggers only on pushes to `main`.
# This is the production deployment pipeline.
# Order: Migrations → Frontend (GitHub Pages)
# Edge Functions deploy independently after migrations. A function deployment
# failure must not block a frontend-only deployment.
# ─────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main

# Prevent concurrent deploys — one at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false   # Don't cancel a running deploy; queue it

permissions:
  contents: write   # needed to push gh-pages branch

jobs:

  # ── Stage 1: Apply database migrations ───────────────
  migrate:
    name: Apply DB Migrations
    runs-on: ubuntu-latest
    environment: production
    outputs:
      migrations_applied: ${{ steps.run_migrations.outputs.applied }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.0

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_TELEMETRY_DISABLED: "1"
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Check migration status (what's pending)
        id: check_pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "=== Current migration status ==="
          supabase db diff --schema public || true
          # List local migrations vs remote
          supabase migration list 2>&1 | tee migration_status.txt
          echo "Migration status logged above."

      - name: Run pending migrations
        id: run_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "=== Checking migration status ==="
          STATUS=$(supabase migration list 2>&1)
          echo "$STATUS"

          # Detect versions that exist on remote but have NO local file.
          # `migration repair --status applied` requires the local file to exist.
          # `migration repair --status reverted` marks them as "skip this" — correct
          # for versions applied directly via SQL Editor that we don't track locally.
          #
          # Parse the migration list table: lines with remote version but blank local column
          # look like: "                  | 20260608093952 | ..."
          REMOTE_ONLY=$(echo "$STATUS" | grep -E "^[[:space:]]+\|[[:space:]]+[0-9]{14}" | grep -oE "[0-9]{14}" || true)

          if [ -n "$REMOTE_ONLY" ]; then
            echo ""
            echo "=== Marking remote-only migrations as reverted (no local file) ==="
            for VERSION in $REMOTE_ONLY; do
              echo "  Reverting: $VERSION"
              supabase migration repair --status reverted "$VERSION" 2>&1 || true
            done
          fi

          echo ""
          echo "=== Pushing new local migrations ==="
          OUTPUT=$(supabase db push 2>&1) || PUSH_EXIT=$?
          echo "$OUTPUT"

          NO_PENDING=$(echo "$OUTPUT" | grep -iE "no migrations|already up to date|nothing to migrate|0 migrations" || true)

          if [ -n "$NO_PENDING" ] || [ -z "$OUTPUT" ]; then
            echo "applied=none" >> "$GITHUB_OUTPUT"
            echo "No new migrations — database is up to date."
          elif [ "${PUSH_EXIT:-0}" -ne 0 ]; then
            echo "::error::supabase db push failed. Output above."
            exit 1
          else
            echo "applied=yes" >> "$GITHUB_OUTPUT"
            echo "Migrations applied successfully."
          fi


      - name: Validate post-migration schema health
        env:
          SUPABASE_URL:          ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL:       ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "=== Post-migration health checks ==="
          python3 scripts/post_migration_health.py
        continue-on-error: false   # Hard failure if schema is broken

  # ── Stage 2: Deploy Edge Functions (independent) ──────
  deploy-functions:
    name: Deploy Changed Edge Functions
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    outputs:
      deployed: ${{ steps.changed_functions.outputs.deploy_required }}
      functions: ${{ steps.changed_functions.outputs.functions }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.0

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_TELEMETRY_DISABLED: "1"
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Detect changed Edge Functions
        id: changed_functions
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA:  ${{ github.sha }}
        run: |
          set -euo pipefail

          # A push with an all-zero `before` SHA is the initial branch push.
          # In that case every function is deployed once to establish the
          # production baseline.
          FUNCTION_FILES=""

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            DEPLOY_ALL=true
            REASON="initial branch deployment"
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
            echo "=== Changed files ==="
            echo "$CHANGED_FILES"

            FUNCTION_FILES=$(printf '%s\n' "$CHANGED_FILES" | grep '^supabase/functions/' || true)
            CONFIG_CHANGED=$(printf '%s\n' "$CHANGED_FILES" | grep -E '^supabase/config\.toml$' || true)
            SHARED_CHANGED=$(printf '%s\n' "$FUNCTION_FILES" | grep '^supabase/functions/_shared/' || true)

            if [ -n "$CONFIG_CHANGED" ]; then
              DEPLOY_ALL=true
              REASON="Supabase function config changed"
            elif [ -n "$SHARED_CHANGED" ]; then
              DEPLOY_ALL=true
              REASON="shared Edge Function code changed"
            else
              DEPLOY_ALL=false
              REASON="no deployable Edge Function changes"
            fi
          fi

          if [ "$DEPLOY_ALL" = true ]; then
            FUNCTIONS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
              -not -name '_shared' -printf '%f\n' | sort | tr '\n' ' ' | xargs)
          else
            FUNCTIONS=$(printf '%s\n' "$FUNCTION_FILES" \
              | sed -n 's#^supabase/functions/\([^/]*\)/.*#\1#p' \
              | grep -v '^_shared$' | sort -u | tr '\n' ' ' | xargs || true)
          fi

          if [ -n "$FUNCTIONS" ]; then
            DEPLOY_REQUIRED=true
          else
            DEPLOY_REQUIRED=false
            FUNCTIONS=""
          fi

          echo "deploy_required=$DEPLOY_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "functions=$FUNCTIONS" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "=== Edge Function deployment decision ==="
          echo "Reason: $REASON"
          echo "Deploy required: $DEPLOY_REQUIRED"
          echo "Functions: ${FUNCTIONS:-none}"

      - name: Restore cached Supabase Edge Runtime image (Docker fallback)
        if: steps.changed_functions.outputs.deploy_required == 'true'
        id: edge_runtime_cache
        uses: actions/cache@v4
        with:
          path: /tmp/setu-edge-runtime.tar
          key: supabase-edge-runtime-v1.73.13-${{ runner.os }}

      - name: Prepare cached Docker fallback
        if: steps.changed_functions.outputs.deploy_required == 'true'
        id: edge_runtime_image
        env:
          CACHE_HIT: ${{ steps.edge_runtime_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          IMAGE='public.ecr.aws/supabase/edge-runtime:v1.73.13'

          if [ "$CACHE_HIT" = 'true' ] && [ -s /tmp/setu-edge-runtime.tar ]; then
            echo "=== Cached Edge Runtime available ==="
            docker load --input /tmp/setu-edge-runtime.tar
            docker image inspect "$IMAGE" >/dev/null
            echo "docker_ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No cached Edge Runtime image found. Docker fallback will pull it only if API deployment fails."
          echo "docker_ready=false" >> "$GITHUB_OUTPUT"

      - name: Deploy Edge Functions
        if: steps.changed_functions.outputs.deploy_required == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          FUNCTIONS: ${{ steps.changed_functions.outputs.functions }}
        run: |
          set -euo pipefail
          echo "=== Deploying Changed Edge Functions ==="
          echo "Functions: $FUNCTIONS"
          FAILED=()
          NO_VERIFY_JWT_FUNCTIONS="razorpay-webhook"
          IMAGE='public.ecr.aws/supabase/edge-runtime:v1.73.13'
          DOCKER_READY='${{ steps.edge_runtime_image.outputs.docker_ready }}'

          prepare_docker_fallback() {
            if [ "$DOCKER_READY" = 'true' ]; then
              return 0
            fi

            echo "=== Preparing Docker fallback ==="
            # Only the fallback path contacts Public ECR. A successful pull is
            # saved into the GitHub Actions cache for subsequent runs.
            docker pull "$IMAGE"
            docker save "$IMAGE" --output /tmp/setu-edge-runtime.tar
            DOCKER_READY=true
          }

          deploy_with_retry() {
            local fname="$1" flags="$2" attempt=1 max_attempts=3 delay=10

            # CI uses server-side bundling first. Supabase documents --use-api
            # specifically for CI because it does not require Docker.
            while (( attempt <= max_attempts )); do
              if supabase functions deploy "$fname" $flags --use-api 2>&1; then
                echo "  ✓ $fname deployed via Supabase API bundling"
                return 0
              fi
              if (( attempt < max_attempts )); then
                echo "⚠ $fname: API deploy attempt $attempt/$max_attempts failed; retrying in ${delay}s…"
                sleep "$delay"
                delay=$((delay * 2))
              fi
              attempt=$((attempt + 1))
            done

            echo "⚠ $fname: API bundling failed. Switching to Docker fallback."
            prepare_docker_fallback

            attempt=1
            delay=10
            while (( attempt <= max_attempts )); do
              if supabase functions deploy "$fname" $flags --use-docker 2>&1; then
                echo "  ✓ $fname deployed via Docker fallback"
                return 0
              fi
              if (( attempt < max_attempts )); then
                echo "⚠ $fname: Docker fallback attempt $attempt/$max_attempts failed; retrying in ${delay}s…"
                sleep "$delay"
                delay=$((delay * 2))
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          for FNAME in $FUNCTIONS; do
            FLAGS=""
            if [[ " $NO_VERIFY_JWT_FUNCTIONS " == *" $FNAME "* ]]; then
              FLAGS="--no-verify-jwt"
              echo "Deploying: $FNAME (--no-verify-jwt — webhook, HMAC-verified internally)"
            else
              echo "Deploying: $FNAME (JWT verification enforced at gateway)"
            fi

            if deploy_with_retry "$FNAME" "$FLAGS"; then
              echo "✓ $FNAME deployment complete"
            else
              echo "✗ $FNAME FAILED"
              FAILED+=("$FNAME")
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed to deploy functions: ${FAILED[*]}"
            exit 1
          fi

      - name: Smoke-test deployed functions
        if: steps.changed_functions.outputs.deploy_required == 'true'
        env:
          SUPABASE_URL:          ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY:     ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=== Edge Function smoke tests ==="
          python3 scripts/smoke_test_functions.py

      - name: No Edge Function deployment needed
        if: steps.changed_functions.outputs.deploy_required != 'true'
        run: |
          echo "✓ No Edge Function changes detected. Nothing to deploy."

  # ── Stage 3: Build and deploy frontend ───────────────
  deploy-frontend:
    name: Deploy Frontend → GitHub Pages
    runs-on: ubuntu-latest
    # Frontend deployment is intentionally independent of Edge Functions.
    # A registry outage or unrelated function failure must not prevent a
    # successfully-built frontend from reaching GitHub Pages.
    needs: migrate
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Inject Firebase config into service worker
        # The service worker lives outside the Vite build context and can't use
        # import.meta.env. We template-replace the __PLACEHOLDER__ values at
        # build time so the SW gets the real config without hardcoding.
        env:
          VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: python3 scripts/inject_sw_config.py

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL:                 ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY:            ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY:           ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_MAPBOX_TOKEN:                 ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_RAZORPAY_KEY_ID:              ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: npm run build

      - name: SPA routing — copy index → 404
        run: cp dist/index.html dist/404.html

      - name: Post-build validation
        run: |
          # Verify critical files exist
          test -f dist/index.html      || (echo "::error::dist/index.html missing" && exit 1)
          test -f dist/404.html        || (echo "::error::dist/404.html missing" && exit 1)
          test -f dist/firebase-messaging-sw.js || \
            echo "::warning::firebase-messaging-sw.js not in dist root (check vite config)"
          # Ensure no placeholder values leaked into the build
          python3 scripts/verify_build_config.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token:   ${{ secrets.GITHUB_TOKEN }}
          publish_dir:    ./dist
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.sha }} — ${{ github.event.head_commit.message }}"

  # ── Stage 4: Post-deploy validation ──────────────────
  validate-deployment:
    name: Post-Deploy Validation
    runs-on: ubuntu-latest
    needs: deploy-frontend
    # Give GitHub Pages up to 60s to propagate before testing
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages propagation
        run: sleep 30

      - name: Smoke-test production URL
        env:
          PROD_URL: ${{ vars.PROD_URL }}   # e.g. https://yourorg.github.io/SETU
        run: |
          python3 scripts/smoke_test_frontend.py

      - name: Notify deployment success
        if: success()
        run: |
          echo "=== Deployment complete ==="
          echo "Commit: ${{ github.sha }}"
          echo "Message: ${{ github.event.head_commit.message }}"
          echo "By: ${{ github.actor }}"
          echo "Time: $(date -u)"
