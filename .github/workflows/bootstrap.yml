name: SETU Bootstrap — Mark Existing Migrations as Applied

# ─────────────────────────────────────────────────────────
# FIXED: Uses Supabase REST API (HTTPS port 443) instead of
# psql (port 5432 — blocked by Supabase for GitHub Actions IPs).
#
# Run this ONCE after Step 7. Manual trigger only.
# Safe to re-run — all operations are idempotent.
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CONFIRM to proceed'
        required: true
        default: ''

jobs:
  bootstrap-migrations:
    name: Mark All Existing Migrations as Applied
    runs-on: ubuntu-latest
    environment: production
    if: github.event.inputs.confirm == 'CONFIRM'

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap via Supabase REST API
        env:
          SUPABASE_URL:            ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/bootstrap_migrations.py

      - name: Verify — list applied migrations
        env:
          SUPABASE_URL:            ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/bootstrap_migrations.py --verify-only
