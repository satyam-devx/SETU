name: Build Android APK

# Manual button in the Actions tab whenever you want a fresh APK, plus
# automatic on version tags (v1.2.3) for a proper tagged release build.
# This does NOT run on every push — the OTA updater (npm run release:ota)
# handles day-to-day JS/CSS/HTML changes without needing a new APK at all.
# Only rebuild the APK for native-shell changes: a new Capacitor plugin,
# an Android permission, the app icon/splash, or the very first install.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle (native base path)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: npx cross-env VITE_BASE_PATH=/ vite build

      # android/ is gitignored and regenerated fresh every run — see the
      # comment in .gitignore. `cap add` bootstraps the native project;
      # `cap sync` copies dist/ + registers plugins into it either way.
      - name: Generate native Android project
        run: npx cap add android

      # android/ is regenerated from scratch above, so this native fix
      # (kills the OS-splash -> blank-white -> app-splash flash) has to
      # be re-applied every run rather than committed once. See the
      # comment header in the script for the root cause.
      - name: Patch native splash seam (kill white-flash)
        run: node scripts/patch-android-native.mjs

      # Must come AFTER `cap add android` — it writes generated icons into
      # android/app/src/main/res/..., which doesn't exist until the step
      # above creates it. Reads the source logo from assets/logo.png.
      - name: Verify native runtime patch
        run: |
          test -f android/app/src/main/java/**/MainActivity.java || true
          grep -R "setDomStorageEnabled\|setCacheMode\|splashSeamBackground" -n android/app/src/main || true

      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#FDF8F0' --iconBackgroundColorDark '#1A1512' --splashBackgroundColor '#FDF8F0' --splashBackgroundColorDark '#1A1512'

      - name: Sync web assets + plugins into the native project
        run: npx cap sync android

      # Native Google Sign-In needs this app's signing certificate SHA-1
      # registered as an Android OAuth client in Google Cloud Console.
      # This runner is ephemeral — without restoring a fixed keystore,
      # Gradle would generate a BRAND NEW debug.keystore (new SHA-1)
      # every single run, breaking Google Sign-In until you re-register
      # it each time. Set the ANDROID_DEBUG_KEYSTORE_BASE64 secret once
      # (see ANDROID_APP.md → "Native Google Sign-In setup") and every
      # build after that reuses the same SHA-1.
      - name: Restore stable debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Restored the persisted debug keystore — SHA-1 will match every run."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set. Gradle will generate a NEW debug keystore this run, so its SHA-1 will differ from any you've registered in Google Cloud Console, and native Google Sign-In will fail. See ANDROID_APP.md → 'Native Google Sign-In setup'."
          fi

      # Prints, from inside THIS run, the exact SHA-1 that is about to sign
      # the APK — so you can compare it character-for-character against the
      # Android OAuth client in Google Cloud Console instead of trusting
      # that your local copy of debug.keystore is still the same file you
      # registered. A mismatch here (even one byte) is why native Google
      # Sign-In fails with a misleading "Sign-in was cancelled" right after
      # picking an account — see ANDROID_APP.md → "Native Google Sign-In
      # setup". Safe to remove once sign-in is confirmed working.
      - name: Print debug keystore SHA-1 (compare against Google Cloud Console)
        run: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -A2 "Certificate fingerprints"

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: setu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # For a Play-Store-ready *signed* release build, add these repo
      # secrets — ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD — then swap the two
      # steps above for `assembleRelease` with a signing config in
      # android/app/build.gradle. Skipped for now — debug APKs install
      # fine for internal testing via "unknown sources".
