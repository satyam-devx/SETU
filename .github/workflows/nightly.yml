name: SETU — Nightly Security & Regression Monitor

# ═══════════════════════════════════════════════════════════
# Runs nightly at 02:00 IST (20:30 UTC) on main branch.
# Separate from the push-triggered QA pipeline — this catches
# issues that emerge over time: new CVEs, dependency drift,
# RLS regressions from Supabase updates, and production health.
# ═══════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST daily
  workflow_dispatch:        # Allow manual runs

env:
  NODE_VERSION: '24'
  QA_DIR: qa

# No permissions block existed before — GITHUB_TOKEN defaulted to whatever
# the repo/org setting is (commonly read-only on newer repos), which is why
# actions/github-script's issue-creation calls failed with 403 "Resource not
# accessible by integration". Explicit, minimal permissions per job instead
# of a blanket write-all. See CHANGELOG.md.
permissions:
  contents: read

jobs:

  # ── Dependency CVE check ──────────────────────────────────
  cve-check:
    name: CVE Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues:   write   # opens an issue when critical/high CVEs are found

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Full vulnerability audit
        id: audit
        run: |
          npm audit --json > audit-results.json 2>&1 || true
          CRITICAL=$(node -e "
            const d = require('./audit-results.json');
            console.log(d.metadata?.vulnerabilities?.critical ?? 0);
          ")
          HIGH=$(node -e "
            const d = require('./audit-results.json');
            console.log(d.metadata?.vulnerabilities?.high ?? 0);
          ")
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "=== Vulnerability summary ==="
          npm audit --audit-level=info || true

      - name: Open issue if critical CVEs found
        if: steps.audit.outputs.critical > 0 || steps.audit.outputs.high > 0
        uses: actions/github-script@v9
        with:
          script: |
            const critical = '${{ steps.audit.outputs.critical }}';
            const high     = '${{ steps.audit.outputs.high }}';

            // Check if issue already open
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'security,automated',
            });
            const existing = issues.data.find(i => i.title.includes('CVE vulnerabilities detected'));
            if (existing) {
              console.log('Issue already open:', existing.number);
              return;
            }

            github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🔒 CVE vulnerabilities detected — ${new Date().toISOString().slice(0,10)}`,
              body:  `## Vulnerability Summary\n\n` +
                     `- Critical: **${critical}**\n` +
                     `- High: **${high}**\n\n` +
                     `Run \`npm audit\` locally for details, or check the workflow artifacts.\n\n` +
                     `**Action required:** Update affected packages before next production deploy.`,
              labels: ['security', 'automated', 'dependencies'],
            });

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit-${{ github.run_id }}
          path: audit-results.json
          retention-days: 90


  # ── Production smoke test ─────────────────────────────────
  production-smoke:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      issues:   write   # opens an issue when the smoke test fails
    if: vars.PROD_URL != ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install QA deps
        working-directory: ${{ env.QA_DIR }}
        run: npm ci

      - name: Install Playwright
        working-directory: ${{ env.QA_DIR }}
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        id: smoke
        working-directory: ${{ env.QA_DIR }}
        env:
          SETU_E2E_URL: ${{ vars.PROD_URL }}
          CI: 'true'
        run: |
          # Run auth and role-isolation tests only — quick smoke
          npx playwright test \
            tests/e2e/auth.spec.js \
            tests/e2e/role-isolation.spec.js \
            --project mobile-chrome \
            --reporter=list,json \
            --timeout 30000 \
            2>&1 | tee smoke-output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Alert on smoke test failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Production smoke test FAILED — ${new Date().toISOString().slice(0,10)}`,
              body:  `Nightly smoke test against production URL failed.\n\n` +
                     `**Production URL:** ${{ vars.PROD_URL }}\n` +
                     `**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n` +
                     `This may indicate a broken deployment. Please investigate immediately.`,
              labels: ['bug', 'production', 'automated', 'regression'],
            });


  # ── Bundle size regression ────────────────────────────────
  bundle-regression:
    name: Bundle Size Regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL:                 'https://placeholder.supabase.co'
          VITE_SUPABASE_ANON_KEY:            'placeholder-anon-key'
          VITE_FIREBASE_API_KEY:             'placeholder'
          VITE_FIREBASE_AUTH_DOMAIN:         'placeholder.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID:          'placeholder-project'
          VITE_FIREBASE_STORAGE_BUCKET:      'placeholder.appspot.com'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID:              '1:000000000000:web:placeholder'
          VITE_FIREBASE_VAPID_KEY:           'placeholder-vapid'
          VITE_MAPBOX_TOKEN:                 'pk.placeholder'
          VITE_RAZORPAY_KEY_ID:              'rzp_test_placeholder'
        run: npm run build

      - name: Analyze bundle
        id: bundle
        run: |
          TOTAL=$(find dist/assets -name "*.js" -exec stat -c%s {} + | awk '{s+=$1} END{print int(s/1024)}')
          LARGEST=$(find dist/assets -name "*.js" -exec stat -c%s {} + | sort -rn | head -1 | awk '{print int($1/1024)}')
          echo "total_kb=$TOTAL"   >> "$GITHUB_OUTPUT"
          echo "largest_kb=$LARGEST" >> "$GITHUB_OUTPUT"
          echo "Total JS: ${TOTAL}KB (budget: 800KB)"
          echo "Largest chunk: ${LARGEST}KB (budget: 500KB)"

          if [ "$TOTAL" -gt 800 ]; then
            echo "::warning::Total JS bundle ${TOTAL}KB exceeds 800KB budget"
          fi
          if [ "$LARGEST" -gt 500 ]; then
            echo "::error::Largest JS chunk ${LARGEST}KB exceeds 500KB budget"
            exit 1
          fi


  # ── RLS policy drift detection ────────────────────────────
  rls-audit:
    name: RLS Policy Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Assemble canonical RLS snapshot for audit
        # The legacy database/rls.sql was removed in the Phase-2
        # migration-tree unification. supabase/migrations/ is now the
        # single canonical tree, so concatenate it into the path the
        # audit checks below expect (ephemeral; not committed).
        run: |
          mkdir -p database
          cat supabase/migrations/*.sql > database/rls.sql

      - name: Verify all tables have RLS enabled
        run: |
          python3 - <<'EOF'
          import re, sys

          TABLES = [
            'villages', 'profiles', 'categories', 'vendors', 'products',
            'orders', 'order_items', 'wallets', 'wallet_transactions',
            'notifications', 'audit_log', 'disputes', 'escalations',
            'payment_events', 'payment_orders', 'rider_locations',
            'credit_accounts', 'seva_providers',
          ]

          with open('database/rls.sql') as f:
            content = f.read()

          enabled = re.findall(r'alter table (\w+) enable row level security', content)
          missing = [t for t in TABLES if t not in enabled]

          if missing:
            print(f"✗ Tables missing RLS: {', '.join(missing)}")
            sys.exit(1)
          else:
            print(f"✓ All {len(TABLES)} tables have RLS enabled")
          EOF

      - name: Verify INSERT policies use WITH CHECK
        run: |
          python3 - <<'EOF'
          import re, sys

          with open('database/rls.sql') as f:
            content = f.read()

          # Find INSERT policies
          insert_policies = re.findall(
            r'create policy "([^"]+)"\s+on \w+ for insert(.*?)(?=create policy|$)',
            content, re.DOTALL | re.IGNORECASE
          )

          failures = []
          for name, body in insert_policies:
            if 'with check' not in body.lower():
              failures.append(name)

          if failures:
            print(f"✗ INSERT policies missing WITH CHECK: {', '.join(failures)}")
            sys.exit(1)
          else:
            print(f"✓ All INSERT policies have WITH CHECK clauses")
          EOF

      - name: Verify audit_log restricted to service_role
        run: |
          python3 - <<'EOF'
          import sys

          with open('database/rls.sql') as f:
            content = f.read()

          # audit_log insert should reference service_role or security definer
          if 'audit_log' in content:
            # Find audit_log section
            idx = content.index('audit_log')
            section = content[idx:idx+2000]
            if 'service_role' in section or 'security definer' in section.lower():
              print("✓ audit_log is properly restricted")
            else:
              print("⚠ audit_log insert policy may not be restricted to service_role")
              # Warning, not failure — may be enforced at function level
          else:
            print("⚠ audit_log not found in rls.sql")
          EOF


  # ── Nightly summary ────────────────────────────────────────
  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: [cve-check, bundle-regression, rls-audit]
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "═══════════════════════════════════"
          echo "SETU Nightly Monitor — $(date -u '+%Y-%m-%d')"
          echo "═══════════════════════════════════"
          echo "CVE Check:          ${{ needs.cve-check.result }}"
          echo "Bundle Regression:  ${{ needs.bundle-regression.result }}"
          echo "RLS Audit:          ${{ needs.rls-audit.result }}"
          echo ""
          if [[ "${{ needs.cve-check.result }}" == "failure" ||
                "${{ needs.bundle-regression.result }}" == "failure" ||
                "${{ needs.rls-audit.result }}" == "failure" ]]; then
            echo "✗ Nightly checks have failures"
            exit 1
          else
            echo "✓ All nightly checks passed"
          fi
