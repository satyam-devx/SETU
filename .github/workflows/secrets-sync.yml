name: SETU Secrets — Sync Edge Function Secrets

# ─────────────────────────────────────────────────────────
# Syncs Edge Function secrets (Supabase Vault) from GitHub
# Secrets whenever secrets-affecting files change OR when
# manually triggered.
#
# WHY THIS EXISTS:
# Supabase Edge Functions read their environment variables
# from the Supabase Vault (project secrets), NOT from GitHub
# Secrets. This workflow bridges the gap: secrets live in
# GitHub Secrets as the source of truth and are pushed to
# Supabase automatically on change.
#
# Secrets managed:
#   RAZORPAY_KEY_ID            → create-razorpay-order
#   RAZORPAY_KEY_SECRET        → create-razorpay-order
#   RAZORPAY_WEBHOOK_SECRET    → razorpay-webhook
#   FIREBASE_PROJECT_ID        → send-fcm-notification
#   FIREBASE_SERVICE_ACCOUNT   → send-fcm-notification (JSON)
#   SUREPASS_API_KEY           → verify-aadhaar, kyc-verify
#   ANTHROPIC_API_KEY          → ai-assistant (Phase 5)
#   SUPABASE_SERVICE_ROLE_KEY  → all functions (auto-set by Supabase)
# ─────────────────────────────────────────────────────────

on:
  # Run whenever secrets config file changes
  push:
    branches: [main]
    paths:
      - '.github/secrets-manifest.yml'
      - '.github/workflows/secrets-sync.yml'
  # Allow manual trigger for initial setup or emergency rotation
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force sync all secrets (not just changed)'
        type: boolean
        default: false

jobs:
  sync-secrets:
    name: Sync Secrets to Supabase Vault
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:      ${{ secrets.SUPABASE_PROJECT_REF }}
          # Razorpay
          RAZORPAY_KEY_ID:           ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET:       ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET:   ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          # Firebase
          FIREBASE_PROJECT_ID:       ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # SurePass (Aadhaar KYC)
          SUREPASS_API_KEY:          ${{ secrets.SUREPASS_API_KEY }}
          # Anthropic (Phase 5 - AI assistant)
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== Syncing secrets to Supabase Vault ==="

          # Helper: only push if value is non-empty
          push_secret() {
            local NAME="$1"
            local VALUE="$2"
            if [ -n "$VALUE" ] && [ "$VALUE" != "" ]; then
              echo "  → $NAME"
              echo "$VALUE" | supabase secrets set "$NAME" --from-stdin
            else
              echo "  ⚠ $NAME is empty — skipping (secret not configured yet)"
            fi
          }

          push_secret "RAZORPAY_KEY_ID"          "$RAZORPAY_KEY_ID"
          push_secret "RAZORPAY_KEY_SECRET"       "$RAZORPAY_KEY_SECRET"
          push_secret "RAZORPAY_WEBHOOK_SECRET"   "$RAZORPAY_WEBHOOK_SECRET"
          push_secret "FIREBASE_PROJECT_ID"        "$FIREBASE_PROJECT_ID"
          push_secret "FIREBASE_SERVICE_ACCOUNT"   "$FIREBASE_SERVICE_ACCOUNT"
          push_secret "SUREPASS_API_KEY"           "$SUREPASS_API_KEY"
          push_secret "ANTHROPIC_API_KEY"          "$ANTHROPIC_API_KEY"

          echo "=== Secret sync complete ==="
          echo "(SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are auto-injected by Supabase)"
