name: SETU Secrets — Sync Edge Function Secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secrets-sync.yml'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force sync all secrets'
        type: boolean
        default: false

jobs:
  sync-secrets:
    name: Sync Secrets to Supabase Vault
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.0

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Write secrets to .env file and push
        env:
          SUPABASE_ACCESS_TOKEN:    ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:     ${{ secrets.SUPABASE_PROJECT_REF }}
          RAZORPAY_KEY_ID:          ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET:      ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET:  ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          FIREBASE_PROJECT_ID:      ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SUREPASS_API_KEY:         ${{ secrets.SUREPASS_API_KEY }}
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          RAZORPAY_ACCOUNT_NUMBER:  ${{ secrets.RAZORPAY_ACCOUNT_NUMBER }}
        run: |
          echo "=== Building secrets .env file ==="

          # Write only non-empty secrets to a temp .env file
          # supabase secrets set --env-file is the correct flag for this CLI version
          ENV_FILE=$(mktemp)

          append() {
            local NAME="$1"
            local VALUE="$2"
            if [ -n "$VALUE" ]; then
              # Escape the value: wrap in single quotes, escape any single quotes inside
              ESCAPED=$(printf '%s' "$VALUE" | sed "s/'/'\\\\''/g")
              echo "${NAME}='${ESCAPED}'" >> "$ENV_FILE"
              echo "  ✓ $NAME"
            else
              echo "  ⚠ $NAME — empty, skipping"
            fi
          }

          append "RAZORPAY_KEY_ID"          "$RAZORPAY_KEY_ID"
          append "RAZORPAY_KEY_SECRET"      "$RAZORPAY_KEY_SECRET"
          append "RAZORPAY_WEBHOOK_SECRET"  "$RAZORPAY_WEBHOOK_SECRET"
          append "FIREBASE_PROJECT_ID"      "$FIREBASE_PROJECT_ID"
          append "FIREBASE_SERVICE_ACCOUNT" "$FIREBASE_SERVICE_ACCOUNT"
          append "SUREPASS_API_KEY"         "$SUREPASS_API_KEY"
          append "ANTHROPIC_API_KEY"        "$ANTHROPIC_API_KEY"

          echo ""
          echo "=== Pushing secrets to Supabase Vault ==="
          supabase secrets set --env-file "$ENV_FILE"

          # Clean up — file contains real secrets
          rm -f "$ENV_FILE"

          echo "=== Secret sync complete ==="
          echo "(SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are auto-injected by Supabase)"
