# Base44 dev environment for SETU.
# Runs the Vite dev server FROM THE CLONED SOURCE with live reload,
# in DEMO mode (no real Supabase backend required for preview).
#
# Bring up:  docker compose -f docker-compose.base44.yml up -d --build
# Preview:   https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
services:
  web:
    image: node:22-slim
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      # Keep installed deps inside a named volume so they survive
      # container recreation without polluting the host bind mount.
      - setu_node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults   # placeholders — app boots without credentials
      - /run/base44/app.env       # platform secrets — LAST, always wins
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  setu_node_modules:
